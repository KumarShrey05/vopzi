 <svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="570" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="purple" x1="100" y1="180" x2="330" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="green" x1="700" y1="180" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blue" x1="400" y1="370" x2="600" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#60A5FA"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1000" height="570" rx="24" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="110" fill="#7C3AED" opacity=".08"/>
  <circle cx="930" cy="490" r="150" fill="#2563EB" opacity=".09"/>

  <text x="500" y="55" text-anchor="middle" fill="#F9FAFB" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Vopzi Architecture</text>
  <text x="500" y="82" text-anchor="middle" fill="#A5B4FC" font-family="Arial, Helvetica, sans-serif" font-size="13">Full-stack messaging application</text>

  <!-- Main flow arrows -->
  <path d="M310 220 H390" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M610 220 H690" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="340" y="211" text-anchor="middle" fill="#C4B5FD" font-family="Arial, Helvetica, sans-serif" font-size="12">API</text>
  <text x="640" y="211" text-anchor="middle" fill="#C4B5FD" font-family="Arial, Helvetica, sans-serif" font-size="12">Queries</text>

  <!-- Frontend -->
  <g filter="url(#shadow)">
    <rect x="90" y="155" width="220" height="130" rx="18" fill="url(#purple)" stroke="#A78BFA" stroke-opacity=".7"/>
  </g>
  <rect x="113" y="177" width="34" height="26" rx="5" stroke="#FFFFFF" stroke-width="2" opacity=".95"/>
  <path d="M113 185 H147 M124 208 H136 M130 203 V208" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="200" y="218" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Frontend</text>
  <text x="200" y="244" text-anchor="middle" fill="#EDE9FE" font-family="Arial, Helvetica, sans-serif" font-size="14">React + Vite</text>
  <text x="200" y="264" text-anchor="middle" fill="#DDD6FE" font-family="Arial, Helvetica, sans-serif" font-size="11">User interface</text>

  <!-- Backend -->
  <g filter="url(#shadow)">
    <rect x="390" y="155" width="220" height="130" rx="18" fill="#312E81" stroke="#818CF8" stroke-width="1.5"/>
  </g>
  <rect x="413" y="177" width="34" height="26" rx="5" stroke="#C7D2FE" stroke-width="2"/>
  <path d="M420 185 L426 190 L420 195 M432 195 H439" stroke="#C7D2FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="500" y="218" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Backend</text>
  <text x="500" y="244" text-anchor="middle" fill="#C7D2FE" font-family="Arial, Helvetica, sans-serif" font-size="14">Node.js + Express</text>
  <text x="500" y="264" text-anchor="middle" fill="#C7D2FE" font-family="Arial, Helvetica, sans-serif" font-size="11">API and application logic</text>

  <!-- Database -->
  <g filter="url(#shadow)">
    <rect x="690" y="155" width="220" height="130" rx="18" fill="url(#green)" stroke="#34D399" stroke-opacity=".8"/>
  </g>
  <ellipse cx="722" cy="185" rx="15" ry="6" stroke="#D1FAE5" stroke-width="2"/>
  <path d="M707 185 V204 C707 212 737 212 737 204 V185 M707 195 C707 203 737 203 737 195" stroke="#D1FAE5" stroke-width="2"/>
  <text x="800" y="218" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Database</text>
  <text x="800" y="244" text-anchor="middle" fill="#D1FAE5" font-family="Arial, Helvetica, sans-serif" font-size="15">MongoDB</text>
  <text x="800" y="264" text-anchor="middle" fill="#A7F3D0" font-family="Arial, Helvetica, sans-serif" font-size="11">Users and messages</text>

  <!-- Socket connection -->
  <path d="M200 285 V450 H390" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
  <path d="M500 285 V390" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <text x="275" y="440" text-anchor="middle" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="12">Real-time events</text>

  <!-- Socket.IO -->
  <g filter="url(#shadow)">
    <rect x="390" y="390" width="220" height="105" rx="18" fill="url(#blue)" stroke="#60A5FA" stroke-width="1.5"/>
  </g>
  <circle cx="410" cy="416" r="5" fill="#BFDBFE"/>
  <circle cx="425" cy="416" r="5" fill="#BFDBFE"/>
  <circle cx="440" cy="416" r="5" fill="#BFDBFE"/>
  <path d="M405 426 H445" stroke="#BFDBFE" stroke-width="2" stroke-linecap="round"/>
  <text x="500" y="453" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Socket.IO</text>
  <text x="500" y="475" text-anchor="middle" fill="#DBEAFE" font-family="Arial, Helvetica, sans-serif" font-size="12">Real-time messaging</text>

  <text x="500" y="535" text-anchor="middle" fill="#9CA3AF" font-family="Arial, Helvetica, sans-serif" font-size="12">React UI  •  Express APIs  •  MongoDB storage  •  Live events</text>
</svg>